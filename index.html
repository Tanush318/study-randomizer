<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Study</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 32px 24px;
      background: white;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Research Study</h2>
    <p id="status">Assigning your questionnaire...</p>
    <div id="result"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyXLB_jSgZMpAShrgXJAteVmMSevn7n1vBTF4KTkcTRzF5lfVIX8TTKpW3ST_446V5v_A/exec";

    function assigned(data) {
      document.getElementById("status").innerText =
        "Assignment successful: Condition " + data.condition;

      const link = document.createElement("a");

      link.href = data.destination;
      link.target = "_self";
      link.innerText = "Open questionnaire";

      document.getElementById("result").appendChild(link);
    }

    function failed() {
      document.getElementById("status").innerText =
        "Assignment failed. Please reload the page.";
    }

    const callbackName = "assignmentCallback";

    window[callbackName] = assigned;

    const script = document.createElement("script");

    script.src =
      APPS_SCRIPT_URL +
      "?callback=" + callbackName +
      "&t=" + Date.now();

    script.onerror = failed;

    document.head.appendChild(script);
  </script>
</body>
</html>
